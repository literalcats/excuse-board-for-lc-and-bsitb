# Render "Blueprint": tells Render how to build and run the app.
# It also creates a PostgreSQL database and connects it automatically.
databases:
  - name: excuse-db
    plan: free            # check Render's current free-tier limits/expiry

services:
  - type: web
    name: excuse-board
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL      # filled in automatically from the database above
        fromDatabase:
          name: excuse-db
          property: connectionString
      - key: SECRET_KEY        # signs login cookies; Render makes a random one
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD    # random; view it in Render dashboard > Environment
        generateValue: true
