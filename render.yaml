# Render "Blueprint": tells Render how to build and run the app.
services:
  - type: web
    name: excuse-board
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY        # signs login cookies; Render makes a random one
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD    # random; view it in Render dashboard > Environment
        generateValue: true
